name: Apply user management 1.4C2.2

on:
  push:
    branches:
      - feature/user-management-14c22
    paths:
      - tools/apply_user_management_14c22.py

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/user-management-14c22
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python tools/apply_user_management_14c22.py

      - name: Validate Python
        run: python -m py_compile app.py db.py

      - name: Validate JavaScript
        run: node --check static/app.js

      - name: Validate diff
        run: git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.py app.py static/app.js static/index.html
          git commit -m "Aggiunge gestione utenti aziendali 1.4C2.2"
          git push origin HEAD:feature/user-management-14c22
