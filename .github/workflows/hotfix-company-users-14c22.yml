name: Hotfix company users 1.4C2.2

on:
  push:
    branches:
      - fix-company-users-context-14c22

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hotfix
        run: python tools/hotfix_company_users_14c22.py

      - name: Validate JavaScript
        run: node --check static/app.js

      - name: Validate Python
        run: python -m py_compile app.py db.py

      - name: Validate version labels
        run: |
          if grep -R "Cloud 1.4C1" static/index.html; then
            echo "Old version label still present"
            exit 1
          fi

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit hotfix and remove temporary automation
        run: |
          rm -f tools/hotfix_company_users_14c22.py
          rm -f .github/workflows/hotfix-company-users-14c22.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix company context in user management 1.4C2.2"
          git push origin HEAD:fix-company-users-context-14c22
